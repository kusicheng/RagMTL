[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magra"
version = "0.1.0"
description = "Resource-bounded retrieval, protected benchmarks, and evidence aggregation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ann = ["faiss-cpu==1.15.1", "threadpoolctl>=3,<4", "numpy>=1.26,<3"]
dense = ["sentence-transformers>=3,<6", "numpy>=1.26,<3"]
mirror = ["pyarrow>=19,<25"]
windows-tls = ["truststore>=0.10,<1"]
cuda-reranker = ["torch==2.12.1", "transformers==4.57.6", "tokenizers==0.22.2", "safetensors==0.7.0", "psutil>=7,<8", "nvidia-ml-py==13.615.71"]
continuity = ["mysql-connector-python==26.10.0"]

[project.scripts]
magra = "magra_rag.cli:main"

[tool.setuptools.packages.find]
include = ["magra_rag*", "magra_benchmark*", "magra_continuity*"]
